# ---------------------------------------------------------------------------
# HALLAZGO: archivos versionados contra la regla del propio repositorio
# ---------------------------------------------------------------------------
#
# No es una entrada por archivo porque son 178 rutas y el patron es uno solo.
#
# 177 archivos bajo .sync_tmp/ estan trackeados en git, pese a que
# [.gitignore:2] declara esa carpeta ignorada. El comentario de la linea
# anterior [.gitignore:1] describe exactamente lo que son: "temporales del
# pipeline de sincronizacion (WAV intermedios, pesan cientos de MB)".
#
# Se sumo un compilado, `__pycache__/sincronizar.cpython-313.pyc` (visto en git ls-files; el analizador no indexa esa carpeta), contra
# [.gitignore:9].
#
# Causa: los archivos se versionaron ANTES de que existiera la regla, y
# .gitignore no des-versiona lo que git ya sigue.
#
# Efecto medido, no estimado:
#   - 111 archivos .wav trackeados pesan 2,7 GB
#   - de esos, 101 estan dentro de .sync_tmp/
#   - el arbol de trabajo completo pesa 2,9 GB, o sea que estos archivos son
#     el 93% del repositorio
#   - por ese tamano, este repositorio no pudo analizarse por descarga y hubo
#     que clonarlo aparte
#
# El remedio saca los archivos del seguimiento SIN borrarlos del disco y SIN
# tocar el historial. Lo decide una persona; este documento no lo ejecuta:
#
#   git rm -r --cached .sync_tmp
#   git rm --cached __pycache__/sincronizar.cpython-313.pyc
#   git commit -m "chore: dejar de versionar temporales ya declarados en .gitignore"
#
# Aviso honesto: esto detiene la sangria hacia adelante, pero los objetos
# siguen en el historial, asi que el clon completo seguira pesando. Purgar el
# historial es otra decision, mas invasiva, y no se propone aqui.

