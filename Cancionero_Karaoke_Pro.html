<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancionero de Prevención de Incendios — Karaoke</title>
<style>
/* ============ Design tokens ============ */
:root{
  /* color (tema oscuro deliberado: producto de escenario/proyección) */
  --bg:#0B241A;
  --surface:#102C21;
  --surface-2:#17392C;
  --border:#2A5641;
  --text:#F4F1E6;
  --text-2:#A9C4B7;
  --accent:#F59E0B;
  --accent-hover:#FFB52E;
  --on-accent:#1A1002;
  --danger:#FF6A5E;
  --scrim:rgba(4,16,11,.62);
  /* espaciado 4/8 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s12:48px;
  /* tipografía */
  --font-ui:system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-display:Georgia,"Times New Roman",serif;
  --fs-xs:12px; --fs-sm:14px; --fs-base:16px; --fs-md:18px; --fs-lg:22px; --fs-xl:28px;
  /* radios y elevación */
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:999px;
  --elev-1:0 1px 3px rgba(0,0,0,.35);
  --elev-2:0 4px 14px rgba(0,0,0,.45);
  --elev-3:0 12px 34px rgba(0,0,0,.55);
  /* movimiento */
  --t-fast:150ms; --t-med:250ms; --t-slow:400ms;
  --ease-out:cubic-bezier(.22,.9,.3,1);
  --ease-in:cubic-bezier(.6,.05,.8,.4);
  /* capas */
  --z-stage:0; --z-panel:40; --z-controls:20; --z-pop:60; --z-toast:100;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  font-size:var(--fs-base);
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  overflow:hidden;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.skiplink{
  position:fixed;top:var(--s2);left:50%;transform:translate(-50%,-64px);
  z-index:var(--z-toast);background:var(--accent);color:var(--on-accent);
  padding:var(--s2) var(--s4);border-radius:var(--r-full);font-weight:600;font-size:var(--fs-sm);
  transition:transform var(--t-fast) var(--ease-out);
}
.skiplink:focus-visible{transform:translate(-50%,0)}

/* ============ Shell ============ */
.app{
  display:grid;height:100dvh;
  grid-template-columns:340px 1fr;
  grid-template-rows:1fr auto;
  grid-template-areas:"panel stage" "panel controls";
}

/* ============ Playlist ============ */
.panel{
  grid-area:panel;display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-right:1px solid var(--border);z-index:var(--z-panel);
}
.panel__head{padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--border)}
.panel__head h1{font-family:var(--font-display);font-size:var(--fs-lg);line-height:1.25;letter-spacing:-.01em}
.panel__head p{font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--s1)}
.tracks{list-style:none;overflow-y:auto;flex:1;padding:var(--s2) 0 max(var(--s2),env(safe-area-inset-bottom))}
.tracks::-webkit-scrollbar{width:10px}
.tracks::-webkit-scrollbar-track{background:transparent}
.tracks::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid var(--surface)}
.track{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  min-height:56px;padding:var(--s2) var(--s5);
  border-left:3px solid transparent;
  transition:background var(--t-fast) var(--ease-out);
}
.track:hover{background:var(--surface-2)}
.track:active{background:var(--surface-2);opacity:.85}
.track[aria-current="true"]{background:var(--surface-2);border-left-color:var(--accent)}
.track__num{
  font-family:var(--font-display);font-weight:700;font-size:var(--fs-md);
  color:var(--accent);min-width:30px;text-align:right;font-variant-numeric:tabular-nums;
}
.track__body{flex:1;min-width:0}
.track__title{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track__style{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track__dur{font-size:var(--fs-xs);color:var(--text-2);font-variant-numeric:tabular-nums}
.track[aria-current="true"] .track__dur{color:var(--accent)}

.drawer-scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:calc(var(--z-panel) - 1);
  opacity:0;pointer-events:none;transition:opacity var(--t-med) var(--ease-out);
}
.drawer-scrim.is-on{opacity:1;pointer-events:auto}

/* ============ Escenario ============ */
.stage{grid-area:stage;position:relative;overflow:hidden;z-index:var(--z-stage);background:var(--bg)}
.stage__bg{position:absolute;inset:0}
.stage__bg img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity var(--t-slow) var(--ease-out);
}
.stage__bg img.is-loaded{opacity:1;animation:kenburns 46s var(--ease-out) infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.stage__shade{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(4,16,11,.66) 0%,rgba(4,16,11,.34) 32%,rgba(4,16,11,.38) 62%,rgba(4,16,11,.78) 100%),
    var(--scrim);
}
.stage__chip{
  position:absolute;top:var(--s4);left:var(--s4);z-index:2;max-width:min(70vw,520px);
  display:flex;align-items:center;gap:var(--s2);
  background:rgba(6,22,16,.72);border:1px solid var(--border);border-radius:var(--r-full);
  padding:var(--s2) var(--s4);box-shadow:var(--elev-1);
}
.stage__chip svg{flex:none;color:var(--accent)}
.stage__chip-title{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage__chip-style{font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap}

.stage__content{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s4);padding:var(--s12) var(--s6);text-align:center;
}
.eyebrow{
  font-size:var(--fs-xs);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);min-height:18px;
  text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.line--ghost{
  width:100%;max-width:860px;overflow-wrap:break-word;
  font-size:clamp(15px,2vw,20px);color:var(--text-2);opacity:.85;min-height:1.5em;
  text-shadow:0 1px 8px rgba(0,0,0,.7);
  transition:opacity var(--t-med) var(--ease-out);
}
.line--now{
  position:relative;width:100%;max-width:940px;overflow-wrap:break-word;
  font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;
  font-size:clamp(26px,4.6vw,54px);line-height:1.2;
  min-height:1.3em;
}
.line--now .line__base{display:block}
.line--now .line__base{color:rgba(244,241,230,.42);text-shadow:0 2px 14px rgba(0,0,0,.65)}
.line--now .line__fill{
  position:absolute;inset:0;color:var(--accent);
  text-shadow:0 0 28px rgba(245,158,11,.35),0 2px 12px rgba(0,0,0,.6);
  clip-path:inset(0 100% 0 0);
}
.pips{display:flex;gap:10px;min-height:12px;align-items:center}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background var(--t-fast),box-shadow var(--t-fast)}
.pips i.on{background:var(--accent);box-shadow:0 0 12px rgba(245,158,11,.7)}

/* ============ Controles ============ */
.controls{
  grid-area:controls;z-index:var(--z-controls);
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  background:var(--surface);border-top:1px solid var(--border);
  padding:var(--s3) var(--s4);
  padding-bottom:max(var(--s3),env(safe-area-inset-bottom));
  box-shadow:var(--elev-2);
}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:var(--r-full);color:var(--text);
  transition:background var(--t-fast) var(--ease-out),transform var(--t-fast) var(--ease-out);
}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.94)}
.iconbtn[aria-expanded="true"]{background:var(--surface-2);color:var(--accent)}
.iconbtn--primary{
  width:56px;height:56px;background:var(--accent);color:var(--on-accent);box-shadow:var(--elev-1);
}
.iconbtn--primary:hover{background:var(--accent-hover)}
.iconbtn svg{width:22px;height:22px}
.iconbtn--primary svg{width:26px;height:26px}
#btnPanel{display:none}

.nowplaying{min-width:0;margin:0 var(--s2);max-width:250px}
.nowplaying strong{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowplaying span{display:block;font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.seek{flex:1;display:flex;align-items:center;gap:var(--s3);min-width:200px}
.time{font-size:var(--fs-sm);color:var(--text-2);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
input[type="range"]{
  -webkit-appearance:none;appearance:none;flex:1;height:44px;background:transparent;cursor:pointer;min-width:80px;
  --p:0%;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;border:1px solid var(--border);
  background:linear-gradient(90deg,var(--accent) var(--p),var(--surface-2) var(--p));
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);margin-top:-7px;border:2px solid var(--bg);
  transition:transform var(--t-fast) var(--ease-out);
}
input[type="range"]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type="range"]::-moz-range-track{
  height:6px;border-radius:3px;border:1px solid var(--border);
  background:linear-gradient(90deg,var(--accent) var(--p),var(--surface-2) var(--p));
}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
#seek{position:relative}

/* progreso pintado del track (webkit) via gradiente inline desde JS */

.pop-wrap{position:relative}
.pop{
  position:absolute;bottom:calc(100% + var(--s2));right:0;z-index:var(--z-pop);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--elev-3);padding:var(--s4);width:250px;
}
.pop h2{font-size:var(--fs-sm);font-weight:600;margin-bottom:var(--s1)}
.pop p{font-size:var(--fs-xs);color:var(--text-2);margin-bottom:var(--s3)}
.pop__row{display:flex;align-items:center;gap:var(--s2)}
.pop__val{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.pop__reset{
  margin-top:var(--s3);width:100%;min-height:44px;border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text-2);
  transition:background var(--t-fast),color var(--t-fast);
}
.pop__reset:hover{background:var(--surface);color:var(--text)}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
  z-index:var(--z-toast);background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);padding:var(--s3) var(--s5);border-radius:var(--r-full);
  font-size:var(--fs-sm);font-weight:600;box-shadow:var(--elev-3);
  opacity:0;pointer-events:none;
  transition:opacity var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out);
}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ Responsive ============ */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-areas:"stage" "controls"}
  .panel{
    position:fixed;inset:0 auto 0 0;width:min(85vw,340px);
    transform:translateX(-102%);transition:transform var(--t-med) var(--ease-out);
    box-shadow:var(--elev-3);
  }
  .panel.is-open{transform:translateX(0)}
  #btnPanel{display:inline-flex}
  .nowplaying{display:none}
  .stage__content{padding:var(--s8) var(--s4)}
}
@media (max-width:560px){
  .controls{gap:var(--s2);padding-left:var(--s2);padding-right:var(--s2);justify-content:center}
  .time{min-width:40px}
  .seek{flex:1 1 100%;order:10;min-width:0}
}

/* ============ Reduced motion ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .stage__bg img.is-loaded{animation:none}
}
</style>
</head>
<body>
<a class="skiplink" href="#controles">Saltar a los controles</a>

<div class="app">
  <aside class="panel" id="panel" aria-label="Lista de canciones">
    <header class="panel__head">
      <h1>Cancionero de Prevención</h1>
      <p id="panelSub">22 canciones · karaoke sincronizado</p>
    </header>
    <ol class="tracks" id="tracks"></ol>
  </aside>

  <div class="drawer-scrim" id="drawerScrim" aria-hidden="true"></div>

  <main class="stage" id="stage" aria-label="Escenario de karaoke">
    <div class="stage__bg"><img id="bgimg" alt="" decoding="async"></div>
    <div class="stage__shade" aria-hidden="true"></div>
    <div class="stage__chip" id="chip">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <div>
        <div class="stage__chip-title" id="chipTitle">—</div>
        <div class="stage__chip-style" id="chipStyle">—</div>
      </div>
    </div>
    <div class="stage__content">
      <p class="eyebrow" id="secLabel"></p>
      <p class="line--ghost" id="prevLine"></p>
      <div class="line--now" id="nowLine">
        <span class="line__base" id="nowBase"></span>
        <span class="line__fill" id="nowFill" aria-hidden="true"></span>
      </div>
      <p class="line--ghost" id="nextLine"></p>
      <div class="pips" id="pips" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </main>

  <footer class="controls" id="controles" tabindex="-1" aria-label="Controles de reproducción">
    <button class="iconbtn" id="btnPanel" aria-label="Mostrar lista de canciones" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <button class="iconbtn" id="btnPrev" aria-label="Canción anterior">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="iconbtn iconbtn--primary" id="btnPlay" aria-label="Reproducir">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
    </button>
    <button class="iconbtn" id="btnNext" aria-label="Canción siguiente">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="nowplaying">
      <strong id="npTitle">—</strong>
      <span id="npMeta">—</span>
    </div>

    <div class="seek">
      <span class="time" id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posición de la canción">
      <span class="time" id="tTot">0:00</span>
    </div>

    <div class="pop-wrap">
      <button class="iconbtn" id="btnOffset" aria-label="Ajustar desfase de la letra" aria-expanded="false" aria-controls="popOffset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
      <div class="pop" id="popOffset" hidden>
        <h2>Desfase de la letra</h2>
        <p>Positivo si la letra va atrasada; negativo si va adelantada.</p>
        <div class="pop__row">
          <input type="range" id="offset" min="-5" max="5" value="0" step="0.25" aria-label="Desfase en segundos">
          <span class="pop__val" id="offsetVal">0.00 s</span>
        </div>
        <button class="pop__reset" id="offsetReset">Restablecer</button>
      </div>
    </div>

    <button class="iconbtn" id="btnFull" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>

<script>

 fogata,\nel que limpia su traspatio también.\nNo hay tarea que sea chica\ncuando el sueño es tan grande, ves:\n¡un país que no se quema\nlo construimos esta vez!\n\n[Pre-coro - los dos]\nY cuando estamos juntos\nno hay fuego que pueda más...\n¡levanta las dos manos\ny canta esta verdad!\n\n[Coro - coro masivo]\n¡Todos somos prevención!\n(¡oooh-oooh!)\n¡Cada casa, cada escuela, cada rincón!\n(¡oooh-oooh!)\nNo esperemos el verano,\nel momento es hoy,\n¡tú y yo, mano con mano,\nsomos la solución!\n¡Todos somos prevención!\n\n[Puente - bajando, casi a capela con palmas]\nPor los bosques que crecieron\nmil años para llegar...\n(oooh...)\nPor los niños que mañana\nbajo su sombra van a jugar...\n(oooh...)\nPor la vida que nos une,\npor el aire y por el mar...\n¡esta promesa que cantamos\nla vamos a cumplir de verdad!\n\n[Cambio de tono - subida épica]\n¡ARRIBA!\n\n[Coro final - coro masivo + coro de niños, tono arriba]\n¡Todos somos prevención!\n(¡los niños también!)\n¡Cada casa, cada escuela, cada rincón!\n(¡cantando otra vez!)\nNo esperemos el verano,\nel momento es hoy,\n¡tú y yo, mano con mano,\nsomos la solución!\n\n[Repite coro - todos, palmas arriba]\n¡Todos somos prevención!\n(¡oooh-oooh!)\n¡Cada casa, cada escuela, cada rincón!\n(¡oooh-oooh!)\nNo esperemos el verano,\nel momento es hoy,\n¡tú y yo, mano con mano,\n¡SOMOS LA SOLUCIÓN!\n\n[Outro - piano suave, voz de niña sola]\nTodos... somos... prevención...\n(oooh...)\nEmpieza hoy.", "file": "Todos Somos Prevención.mp3", "url": "Audios/Todos Somos Prevención.mp3", "bg": "Imagenes/Todos Somos Prevención.png", "bgType": "image", "times": [7.74, 8.14, 10.48, 18.22, 21.86, 26.71, 28.85, 34.54, 37.98, 41.53, 44.86, 49.55, 54.17, 57.52, 62.65, 64.65, 69.39, 73.5, 76.86, 80.63, 83.48, 89.11, 91.61, 95.6, 98.1, 101.27, 103.09, 104.09, 106.59, 108.58, 111.34, 115.86, 121.89, 123.84, 125.82, 128.05, 130.55, 132.33, 138.04, 141.23, 144.7, 147.52, 153.14, 155.51, 160.17, 162.0, 165.26, 166.99, 168.49, 170.49, 172.48, 175.34, 179.6, 185.26, 189.24, 193.21, 193.61, 197.59, 204.93, 205.33, 205.93, 209.31, 213.42, 219.25, 221.6, 223.9, 227.25, 230.39, 231.25, 232.39, 234.51, 237.38, 239.72, 241.88, 245.09, 245.63, 248.37, 250.5, 252.36, 255.36, 259.98, 262.35, 263.02]}, {"n": 11, "title": "Alerta Roja", "style": "Salsa", "dur": 210000, "lyrics": "[Intro - trombones y timbal]\n¡Óyeme bien, que hoy no es un día cualquiera!\n¡Azúcar... pero sin candela!\n\n[Verso 1]\nPrendo la radio en la mañana\ny escucho la información:\n\"mucho calor, viento fuerte,\nsequedad en la región\".\nEse trío es peligroso,\nóyelo bien, corazón:\n¡hoy el fuego anda buscando\nla más mínima ocasión!\n\n[Coro]\n¡Alerta roja! (¡hoy no se enciende ná!)\n¡Alerta roja! (¡ni una chispa, na' de na'!)\nCalor, viento y sequía,\nla mezcla más traicionera,\n¡hoy guardamos el fosforito\ny bailamos salsa entera!\n\n[Verso 2]\nHoy no quemo, no parrillo\nen el pasto ni el rincón,\nhoy no paso la máquina\nen la hora de calor.\nLo que pensaba hacer con fuego\nlo dejo pa' otra ocasión,\n¡que un día de paciencia\nvale más que un quemazón!\n\n[Coro]\n¡Alerta roja! (¡hoy no se enciende ná!)\n¡Alerta roja! (¡ni una chispa, na' de na'!)\nCalor, viento y sequía,\nla mezcla más traicionera,\n¡hoy guardamos el fosforito\ny bailamos salsa entera!\n\n[Montuno - sonero improvisando con coro]\n(¡Alerta roja, hoy no se enciende!)\n¡Mira el aviso oficial, que la autoridad no miente!\n(¡Alerta roja, hoy no se enciende!)\n¡Y avísale a tu vecino, y avísale a tu gente!\n(¡Alerta roja, hoy no se enciende!)\n¡Que mañana con la lluvia hacemos fuego nuevamente!\n(¡Alerta roja, hoy no se enciende!)\n¡Trombón, dale caliente... pero solo el trombón, oyente!\n\n[Mambo de trombones]\n\n[Coro final x2 y outro]\n¡Alerta roja! (¡hoy no se enciende ná!)\n¡Alerta roja! (¡ni una chispa, na' de na'!)\nCalor, viento y sequía,\nla mezcla más traicionera,\n¡hoy guardamos el fosforito\ny bailamos salsa entera!\n¡Sin candela... pero con sabor!", "file": "Alerta Roja.mp3", "url": "Audios/Alerta Roja.mp3", "bg": "Imagenes/Alerta Roja.png", "bgType": "image", "times": [3.76, 8.94, 31.35, 33.32, 36.06, 39.11, 41.24, 43.38, 45.94, 47.95, 52.52, 57.09, 60.75, 62.88, 65.48, 67.45, 73.24, 75.99, 78.73, 81.17, 83.3, 86.04, 88.34, 91.04, 94.88, 99.32, 102.5, 105.24, 107.38, 109.51, 124.75, 127.49, 131.15, 133.28, 138.46, 139.99, 142.42, 146.08, 178.08, 178.69, 181.13, 182.96, 185.4, 187.08, 200.02]}, {"n": 12, "title": "Chispa Traicionera", "style": "Ska", "dur": 216000, "lyrics": "[Intro - vientos ska]\n¡Eh! ¡Eh! ¡Cuidado con la chispa!\n(pick it up, pick it up!)\n\n[Verso 1]\nDon José con su esmeril\ncortando fierro en el portón,\ncada chispa que saltaba\naterrizaba en el pastón.\n\"¡Pare, pare, don José,\nmire bien alrededor:\nprimero moje la zona\ny despeje, por favor!\"\n\n[Coro - saltando]\n¡Chispa, chispa traicionera!\n(¡cuidado, cuidado!)\n¡Salta donde no la esperas!\n(¡mojado, mojado!)\nSi hay faena con chispita:\nagua cerca, zona limpita,\ntempranito la pega entera...\n¡y le ganas a la traicionera!\n¡Hey!\n\n[Verso 2]\nLa soldadora en el campo,\nla desbrozadora al ras,\nla cosechadora al medio día...\n¡puro riesgo nada más!\nLa pega se hace temprano\ncuando hay fresco y humedad,\ncon extintor a la mano\ny un compadre pa' vigilar.\n\n[Coro - saltando]\n¡Chispa, chispa traicionera!\n(¡cuidado, cuidado!)\n¡Salta donde no la esperas!\n(¡mojado, mojado!)\nSi hay faena con chispita:\nagua cerca, zona limpita,\ntempranito la pega entera...\n¡y le ganas a la traicionera!\n\n[Puente - solo bajo y batería, hablado]\n¡Atención, cuadrilla, el checklist de la faena!\n¿Zona despejada tres metros? (¡SÍ!)\n¿Agua o extintor al lado? (¡SÍ!)\n¿Horario tempranero? (¡SÍ!)\n¿Alguien mirando el pasto media hora después? (¡SÍ!)\n¡Porque la chispa se esconde y aparece después, eh!\n¡VIENTOS!\n\n[Solo de trompeta y trombón - skanking]\n\n[Coro final x2]\n¡Chispa, chispa traicionera!\n(¡cuidado, cuidado!)\n¡Salta donde no la esperas!\n(¡mojado, mojado!)\nSi hay faena con chispita:\nagua cerca, zona limpita,\ntempranito la pega entera...\n¡y le ganas a la traicionera!\n\n[Outro]\n¡Faena segura! (¡hey!)\n¡Campo tranquilo! (¡hey!)\n¡Chispa dominada! (¡hey, hey, HEY!)", "file": "Chispa Traicionera.mp3", "url": "Audios/Chispa Traicionera.mp3", "bg": "Imagenes/Chispa Traicionera.png", "bgType": "image", "times": [2.62, 6.1, 30.47, 32.68, 33.08, 33.48, 36.16, 38.06, 41.54, 42.8, 46.79, 49.76, 52.93, 55.78, 58.62, 59.71, 62.1, 65.58, 69.06, 71.59, 73.99, 76.66, 79.19, 81.26, 82.84, 86.15, 88.05, 93.24, 95.64, 98.32, 100.38, 101.97, 104.81, 107.66, 110.51, 116.08, 120.95, 123.48, 125.38, 129.17, 132.65, 137.72, 159.23, 162.71, 165.24, 167.58, 168.84, 171.25, 174.73, 177.39, 188.97, 202.26, 204.15]}, {"n": 13, "title": "Parque Querido", "style": "Andino (saya)", "dur": 237000, "lyrics": "[Intro - zampoñas y bombo]\n¡Jallalla! ¡Arriba el parque!\n¡Caminante, ven a celebrar!\n\n[Verso 1]\nMe fui de excursión al parque\ncon mochila y con amor,\nme recibió el guardaparques:\n\"bienvenido, visitador.\nAquí el fuego está prohibido,\nni fogata ni farol,\nque este bosque milenario\nno conoce otro calor... ¡que el del sol!\"\n\n[Coro - todos]\n¡Parque querido, yo te cuido!\n(¡jallalla, jallalla!)\n¡Por el sendero voy contigo!\n(¡camina, camina!)\nMi cocinilla en su lugar,\nmi basura de vuelta va,\n¡el que ama la montaña\nla deja igual... o mejor la va a dejar!\n\n[Verso 2]\nSi quiero comer caliente,\nla zona habilitada está,\ncocinilla, no fogata,\ny vigilo hasta apagar.\nDel sendero no me salgo,\nque la flora sabe más,\ny si veo alguna humareda...\n¡al guardaparques voy a avisar!\n\n[Coro - todos]\n¡Parque querido, yo te cuido!\n(¡jallalla, jallalla!)\n¡Por el sendero voy contigo!\n(¡camina, camina!)\nMi cocinilla en su lugar,\nmi basura de vuelta va,\n¡el que ama la montaña\nla deja igual... o mejor la va a dejar!\n\n[Puente - bombo y palmas, coro femenino]\nMil años tiene el alerce,\nmil años el queñual,\ndiez minutos de descuido...\n¡y no vuelven nunca más!\nPor eso yo te prometo,\nmontaña de mi cantar:\n¡mis fotos me las llevo,\nmis huellas nada más!\n\n[Interludio de zampoñas y quena - fiesta]\n\n[Coro final x2 - subiendo]\n¡Parque querido, yo te cuido!\n(¡jallalla, jallalla!)\n¡Por el sendero voy contigo!\n(¡camina, camina!)\nMi cocinilla en su lugar,\nmi basura de vuelta va,\n¡el que ama la montaña\nla deja igual... o mejor la va a dejar!\n\n[Outro - todos]\n¡Jallalla el parque! (¡jallalla!)\n¡Jallalla el bosque! (¡jallalla!)\n¡Jallalla el que cuida!\n¡JALLALLAAAA!", "file": "Parque Querido.mp3", "url": "Audios/Parque Querido.mp3", "bg": "Imagenes/Parque Querido.png", "bgType": "image", "times": [4.34, 10.66, 43.25, 45.78, 47.68, 50.53, 52.74, 55.59, 57.8, 61.47, 66.03, 68.56, 70.46, 72.99, 76.0, 78.49, 80.58, 84.06, 87.23, 89.44, 92.6, 94.67, 97.54, 99.08, 101.62, 104.94, 109.06, 111.59, 113.48, 116.02, 119.18, 121.71, 123.29, 127.09, 129.94, 132.47, 135.31, 137.53, 140.52, 142.91, 145.44, 148.13, 193.84, 196.06, 198.27, 200.49, 203.65, 206.5, 208.08, 211.69, 214.72, 217.57, 220.1, 222.63]}, {"n": 14, "title": "Cuenta Conmigo, Vecino", "style": "Vallenato", "dur": 262000, "lyrics": "[Intro - acordeón fiestero]\n¡Epa! ¡Esta parranda es del barrio entero!\n¡Y en este barrio nadie se queda atrás!\n\n[Verso 1]\nEn mi calle vive doña Rosa,\nochenta años de dulzura y de bondad,\ncamina despacito con su bastoncito\ny vive solita en la mitad.\nPor eso en la reunión de enero\nel barrio entero decidió:\n\"si algún día hay que salir corriendo...\n¡doña Rosa sale primero, sí señor!\"\n\n[Coro - todos]\n¡Cuenta conmigo, vecino!\n(¡cuenta conmigo!)\n¡Que en la emergencia yo paso por ti!\n(¡yo paso por ti!)\nEl barrio que se organiza\ntiene un ángel en cada esquina,\n¡y aquí nadie, pero nadie,\nse me queda sin salir!\n¡Epa!\n\n[Verso 2]\nDon Julio con su sillita de ruedas\nya sabe quién lo viene a buscar,\nla señora Elvira con sus remedios\nen la mochila los tiene ya.\nHicimos una listita\nde quién necesita más,\ncada casa con su encargado...\n¡así se cuida de verdad!\n\n[Coro - todos]\n¡Cuenta conmigo, vecino!\n(¡cuenta conmigo!)\n¡Que en la emergencia yo paso por ti!\n(¡yo paso por ti!)\nEl barrio que se organiza\ntiene un ángel en cada esquina,\n¡y aquí nadie, pero nadie,\nse me queda sin salir!\n\n[Puente - acordeón bajando, medio hablado]\nY óigame, mi gente, que esto es con tiempo:\nla lista se hace en invierno, no cuando hay humo adentro.\n¿Quién vive solo? ¿Quién no escucha bien?\n¿Quién no puede caminar? ¿Quién no tiene con quién?\nTimbre por timbre, casa por casa,\n¡el censo del cariño es lo que nos abraza!\n¡Acordeóoooon!\n\n[Solo de acordeón - parranda]\n\n[Verso 3]\nY cuando pasó la alarma\ny todos pudimos volver,\ndoña Rosa hizo unas tortillas\npa'l barrio entero comer.\n\"Gracias, mis muchachitos\",\ndijo con emoción...\n¡y esa es la mejor paga\nque recibe el corazón!\n\n[Coro final x2 - fiesta]\n¡Cuenta conmigo, vecino!\n(¡cuenta conmigo!)\n¡Que en la emergencia yo paso por ti!\n(¡yo paso por ti!)\nEl barrio que se organiza\ntiene un ángel en cada esquina,\n¡y aquí nadie, pero nadie,\nse me queda sin salir!\n\n[Outro]\n¡Doña Rosa! (¡presente!)\n¡Don Julio! (¡presente!)\n¡El barrio completo!... ¡PRESENTE!\n¡Epa, epaaaa!", "file": "Cuenta Conmigo, Vecino.mp3", "url": "Audios/Cuenta Conmigo, Vecino.mp3", "bg": "Imagenes/Cuenta Conmigo, Vecino.png", "bgType": "image", "times": [8.46, 12.43, 40.66, 44.63, 49.04, 51.69, 55.22, 58.31, 61.84, 66.25, 69.78, 72.43, 74.86, 76.4, 79.93, 82.78, 86.1, 89.19, 94.04, 100.82, 104.36, 108.16, 111.06, 115.03, 118.11, 121.64, 125.13, 128.24, 130.44, 132.64, 134.63, 137.93, 141.25, 144.34, 147.87, 153.01, 155.81, 160.95, 163.97, 167.45, 171.25, 175.22, 191.99, 195.52, 199.34, 203.3, 206.68, 210.08, 213.6, 216.69, 219.78, 221.99, 224.19, 226.4, 229.49, 232.77, 235.87, 239.42, 243.16, 245.37, 247.58, 250.66]}, {"n": 15, "title": "Mi Mascota También", "style": "Bachata", "dur": 252000, "lyrics": "[Intro - requinto juguetón]\nOye... esta bachata tiene cuatro patas...\n¡y mueve la cola!\n\n[Verso 1]\nMi perrito se llama Choco\ny es parte de mi corazón,\npor eso cuando hicimos\nel plan de evacuación,\nle pusimos su chapita\ncon mi número de tel,\nsu correa está en la puerta...\n¡porque él también viene, mi bien!\n\n[Pre-coro - mujer]\nQue no se quede, que no se quede,\namarradito no puede estar...\nQue viene conmigo, que viene conmigo,\n¡en la mochila va su comida y ya!\n\n[Coro - los dos]\n¡Mi mascota también! (¡también!)\n¡tiene plan de emergencia, mi bien! (¡mi bien!)\nCorrea, chapita y transportador,\nagüita, comida y mucho amor.\n¡Mi mascota también! (¡también!)\n¡se evacúa conmigo, ya ves! (¡ya ves!)\nPorque en esta familia, óyelo bien:\n¡no se queda nadie... ni el pez!\n\n[Verso 2]\nLa gatita de mi abuela\ntiene caja pa' viajar,\nla tenemos siempre a mano,\nno hay que ponerse a buscar.\nY el canario, y la tortuga,\ntodos tienen su lugar,\n¡ensayamos con cariño\npa' que nadie quede atrás!\n\n[Pre-coro - hombre]\nQue no se suelte, que no se suelte,\nque asustado se puede perder...\nQue va seguro, que va segurito,\n¡en su cajita o de la correa, mi bien!\n\n[Coro - los dos]\n¡Mi mascota también! (¡también!)\n¡tiene plan de emergencia, mi bien! (¡mi bien!)\nCorrea, chapita y transportador,\nagüita, comida y mucho amor.\n¡Mi mascota también! (¡también!)\n¡se evacúa conmigo, ya ves! (¡ya ves!)\nPorque en esta familia, óyelo bien:\n¡no se queda nadie... ni el pez!\n\n[Puente - bajando, romántico-juguetón]\nY si tienes gallinitas, caballito o un corral,\npiensa desde ahorita pa' dónde los vas a llevar...\nHabla con el vecino que tiene su camión,\nque los animales grandes... ¡también tienen corazón!\nY nunca, nunca, nunca los dejes amarrados,\n¡que sueltos en el campo se salvan solitos, cuidado!\n\n[Solo de requinto - bailable]\n\n[Coro final x2]\n¡Mi mascota también! (¡también!)\n¡tiene plan de emergencia, mi bien! (¡mi bien!)\nCorrea, chapita y transportador,\nagüita, comida y mucho amor.\ ontrario!\n¡Prevención!\n\n[Outro - reportero]\nY así termina la entrevista más caliente del año.\nYa saben, estimado público:\nel Señor Fuego odia la prevención...\n¡démosle en el gusto... digo, en el disgusto!\nHasta la próxima. Chan.", "file": "El Señor Fuego.mp3", "url": "Audios/El Señor Fuego.mp3", "bg": "Imagenes/Entrevista al Señor Fuego.png", "bgType": "image", "times": [1.25, 4.24, 7.74, 11.23, 20.72, 23.71, 26.71, 28.46, 32.7, 35.69, 37.94, 39.94, 43.43, 48.43, 50.42, 51.67, 53.17, 55.66, 58.66, 60.66, 63.15, 67.65, 71.14, 74.63, 75.88, 78.88, 82.87, 86.37, 90.61, 92.61, 96.1, 100.59, 102.34, 103.84, 105.09, 107.58, 110.83, 113.08, 114.57, 120.31, 128.05, 128.45, 134.92, 137.29, 140.28, 144.28, 149.52, 150.02, 172.48, 174.23, 175.73, 177.23, 179.97, 182.72, 184.96, 185.71, 190.21, 194.2, 197.69, 202.94, 212.17]}, {"n": 21, "title": "El Ranking del Descuido", "style": "Rock humorístico tipo ranking televisivo", "dur": 224000, "lyrics": "[Intro - redoble y organillo]\n¡Damas, caballeros, niños y mascotas!\n¡Bienvenidos al ranking más vergonzoso de la semana!\n¡El Top Cinco... del DESCUIDO!\n(¡ooooh!)\n\n[Coro]\n¡El ranking del descuido!\n(¡qué vergüenza, qué papelón!)\n¡Descuidos que provocan\nmás de algún quemazón!\nPero atento, no te rías,\nque esto tiene solución:\n¡el que sale de este ranking...\nse gana la prevención!\n\n[Verso 1 - lugar 5]\n¡En el QUINTO lugar!\n(redoble... ¡tan!)\n¡La colilla voladora\nque salió por la ventana!\n(¡nooo!)\nSu dueño dijo \"no es nada\"...\n¡y quemó media semana!\n(¡uuuh, descalificado!)\n\n[Verso 2 - lugar 4]\n¡En el CUARTO lugar!\n(redoble... ¡tan!)\n¡La parrilla del domingo\nabandonada con brasitas!\n(¡nooo!)\nSe fueron a la siesta...\n¡y despertó a toditas las casitas!\n(¡qué bochorno, caballero!)\n\n[Coro]\n¡El ranking del descuido!\n(¡qué vergüenza, qué papelón!)\n¡Descuidos que provocan\nmás de algún quemazón!\nPero atento, no te rías,\nque esto tiene solución:\n¡el que sale de este ranking...\nse gana la prevenci /* ============ util ============ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
};
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 3500);
}

/* ============ modelo ============ */
/* Parsea la letra en líneas cantadas con su sección — misma regla con la que
   se generaron los tiempos: se excluyen las etiquetas [Sección] al inicio de
   bloque y las líneas vacías. */
function parseLines(lyrics){
  const out = [];
  lyrics.split('\n\n').forEach(block => {
    let sec = null;
    block.split('\n').forEach((line, i) => {
      const t = line.trim();
      if (i === 0 && t.startsWith('[') && t.endsWith(']')){
        sec = t.slice(1, -1);
        return;
      }
      if (t !== '') out.push({ text: line, sec });
    });
  });
  /* heredar sección hacia adelante */
  let last = '';
  out.forEach(l => { if (l.sec) last = l.sec; else l.sec = last; });
  return out;
}

SONGS.forEach(s => {
  s.lines = parseLines(s.lyrics);
  s.synced = Array.isArray(s.times) && s.times.length === s.lines.length && s.lines.length > 0;
});

/* ============ estado ============ */
const audio = $('audio');
let current = -1;
let offset = 0;
try{ offset = parseFloat(localStorage.getItem('karaoke_pro_offset')) || 0; }catch(e){}
let seeking = false;
let lastIdx = -2, lastFill = -1, lastPips = -1, lastTimeTxt = '';

/* ============ playlist ============ */
function buildTracks(){
  const ol = $('tracks');
  SONGS.forEach((s, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'track';
    b.setAttribute('aria-current', 'false');
    b.innerHTML =
      '<span class="track__num" aria-hidden="true">' + String(s.n).padStart(2,'0') + '</span>' +
      '<span class="track__body"><span class="track__title"></span><span class="track__style"></span></span>' +
      '<span class="track__dur"></span>';
    b.querySelector('.track__title').textContent = s.title;
    b.querySelector('.track__style').textContent = s.style;
    b.querySelector('.track__dur').textContent = fmt(s.dur/1000);
    b.setAttribute('aria-label', 'Canción ' + s.n + ': ' + s.title + ', ' + s.style);
    b.addEventListener('click', () => { load(i, true); closeDrawer(); });
    li.appendChild(b);
    ol.appendChild(li);
  });
}

function markActive(){
  document.querySelectorAll('.track').forEach((b, i) => {
    b.setAttribute('aria-current', i === current ? 'true' : 'false');
  });
  const el = document.querySelectorAll('.track')[current];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ============ carga de canción ============ */
function load(i, autoplay){
  current = (i + SONGS.length) % SONGS.length;
  const s = SONGS[current];
  lastIdx = -2; lastFill = -1;

  $('chipTitle').textContent = String(s.n).padStart(2,'0') + ' · ' + s.title;
  $('chipStyle').textContent = s.style + (s.synced ? ' · karaoke sincronizado' : '');
  $('npTitle').textContent = s.title;
  $('npMeta').textContent = s.style;
  $('tTot').textContent = fmt(s.dur/1000);
  $('seek').value = 0;
  $('seek').style.setProperty('--p', '0%');
  $('seek').setAttribute('aria-valuetext', '0:00 de ' + fmt(s.dur/1000));
  $('secLabel').textContent = '';
  $('prevLine').textContent = '';
  $('nextLine').textContent = s.lines[0] ? s.lines[0].text : '';
  setNow(s.title, 0, true);

  const img = $('bgimg');
  img.classList.remove('is-loaded');
  if (s.bg){
    img.onload = () => img.classList.add('is-loaded');
    img.src = s.bg;
  } else {
    img.removeAttribute('src');
  }

  if (s.url){
    audio.src = s.url;
    if (autoplay) audio.play().catch(() => toast('Toca reproducir para comenzar'));
  } else {
    audio.removeAttribute('src');
    toast('Esta canción no tiene audio disponible');
  }

  markActive();
  updatePlayIcon();

  /* precargar el fondo de la siguiente canción */
  const next = SONGS[(current + 1) % SONGS.length];
  if (next.bg){ const pre = new Image(); pre.src = next.bg; }
}

let nowText = null;
function setNow(text, fillPct, isTitle){
  if (nowText !== text){
    nowText = text;
    $('nowBase').textContent = text;
    $('nowFill').textContent = text;
    $('nowLine').style.opacity = isTitle ? .9 : 1;
  }
  const pct = clamp(fillPct*100, 0, 100);
  if (Math.abs(pct - lastFill) >= .5 || pct === 0 || pct === 100){
    lastFill = pct;
    $('nowFill').style.clipPath = 'inset(0 ' + (100 - pct).toFixed(1) + '% 0 0)';
  }
}

/* ============ reproducción ============ */
function playing(){ return audio.src && !audio.paused && !audio.ended; }
function updatePlayIcon(){
  const on = playing();
  $('icoPlay').style.display = on ? 'none' : '';
  $('icoPause').style.display = on ? '' : 'none';
  $('btnPlay').setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
}
function togglePlay(){
  if (!audio.src){ toast('Esta canción no tiene audio disponible'); return; }
  if (audio.paused) audio.play().catch(() => toast('El navegador bloqueó la reproducción'));
  else audio.pause();
}
audio.addEventListener('play', updatePlayIcon);
audio.addEventListener('pause', updatePlayIcon);
audio.addEventListener('ended', () => load(current + 1, true));
audio.addEventListener('error', () => { if (audio.src) toast('No se pudo cargar el audio — revisa la carpeta Audios/'); });
audio.addEventListener('loadedmetadata', () => {
  if (isFinite(audio.duration) && audio.duration > 0){
    SONGS[current].dur = Math.round(audio.duration * 1000);
    $('tTot').textContent = fmt(audio.duration);
  }
});

function duration(){
  if (isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  return SONGS[current] ? SONGS[current].dur/1000 : 0;
}

/* ============ bucle de render ============ */
function tick(){
  const s = SONGS[current];
  if (s){
    const d = duration();
    const t = (audio.currentTime || 0) + offset;

    /* línea activa */
    let idx = -1;
    if (s.synced){
      const times = s.times;
      for (let k = 0; k < times.length; k++){ if (t >= times[k]) idx = k; else break; }
    } else if (d > 0){
      idx = clamp(Math.floor(t / d * s.lines.length), -1, s.lines.length - 1);
    }

    if (idx !== lastIdx){
      lastIdx = idx;
      if (idx < 0){
        $('secLabel').textContent = s.style;
        $('prevLine').textContent = '';
        $('nextLine').textContent = s.lines[0] ? s.lines[0].text : '';
        setNow(s.title, 0, true);
      } else {
        const L = s.lines[idx];
        $('secLabel').textContent = L.sec || '';
        $('prevLine').textContent = idx > 0 ? s.lines[idx-1].text : '';
        $('nextLine').textContent = idx < s.lines.length-1 ? s.lines[idx+1].text : '';
        setNow(L.text, 0, false);
      }
    }

    /* barrido de la línea actual */
    if (idx >= 0 && s.synced){
      const start = s.times[idx];
      const end = idx < s.times.length-1 ? s.times[idx+1] : Math.min(d, start + 4);
      setNow(nowText, (t - start) / Math.max(.35, end - start), false);
    }

    /* pips de espera hasta la próxima línea */
    let gap = 99;
    if (s.synced){
      if (idx < 0 && s.times.length) gap = s.times[0] - t;
      else if (idx >= 0 && idx < s.times.length-1 && lastFill >= 100) gap = s.times[idx+1] - t;
    }
    const on = gap > 2.6 ? 0 : gap > 1.7 ? 1 : gap > .85 ? 2 : gap > 0 ? 3 : 0;
    if (on !== lastPips){
      lastPips = on;
      [...$('pips').children].forEach((el, k) => el.classList.toggle('on', k < on));
    }

    /* tiempo y barra */
    const cur = audio.currentTime || 0;
    const txt = fmt(cur);
    if (txt !== lastTimeTxt){ lastTimeTxt = txt; $('tCur').textContent = txt; }
    if (!seeking && d > 0){
      const v = Math.round(cur / d * 1000);
      const el = $('seek');
      if (+el.value !== v){
        el.value = v;
        el.style.setProperty('--p', (v/10) + '%');
        el.setAttribute('aria-valuetext', txt + ' de ' + fmt(d));
      }
    }
  }
  requestAnimationFrame(tick);
}

/* ============ seek ============ */
const seekEl = $('seek');
seekEl.addEventListener('pointerdown', () => seeking = true);
seekEl.addEventListener('input', () => {
  seeking = true;
  $('tCur').textContent = fmt(seekEl.value/1000 * duration());
});
seekEl.addEventListener('change', () => {
  audio.currentTime = seekEl.value/1000 * duration();
  seeking = false;
});
window.addEventListener('pointerup', () => { seeking = false; });

/* ============ offset ============ */
const offEl = $('offset'), offVal = $('offsetVal');
function renderOffset(){
  offEl.value = offset;
  offVal.textContent = (offset > 0 ? '+' : '') + offset.toFixed(2) + ' s';
}
offEl.addEventListener('input', () => {
  offset = parseFloat(offEl.value);
  renderOffset();
  try{ localStorage.setItem('karaoke_pro_offset', String(offset)); }catch(e){}
});
$('offsetReset').addEventListener('click', () => {
  offset = 0; renderOffset();
  try{ localStorage.setItem('karaoke_pro_offset', '0'); }catch(e){}
});
renderOffset();

const btnOffset = $('btnOffset'), popOffset = $('popOffset');
function togglePop(force){
  const open = force !== undefined ? force : popOffset.hidden;
  const wasOpen = !popOffset.hidden;
  popOffset.hidden = !open;
  btnOffset.setAttribute('aria-expanded', String(open));
  if (open) offEl.focus();
  else if (wasOpen) btnOffset.focus();
}
btnOffset.addEventListener('click', () => togglePop());
document.addEventListener('click', e => {
  if (!popOffset.hidden && !e.target.closest('.pop-wrap')) togglePop(false);
});

/* ============ drawer móvil ============ */
const panel = $('panel'), drawerScrim = $('drawerScrim'), btnPanel = $('btnPanel');
function openDrawer(){
  panel.classList.add('is-open');
  drawerScrim.classList.add('is-on');
  btnPanel.setAttribute('aria-expanded', 'true');
  const act = document.querySelector('.track[aria-current="true"]');
  if (act) act.focus();
}
function closeDrawer(){
  const wasOpen = panel.classList.contains('is-open');
  panel.classList.remove('is-open');
  drawerScrim.classList.remove('is-on');
  btnPanel.setAttribute('aria-expanded', 'false');
  if (wasOpen && getComputedStyle(btnPanel).display !== 'none') btnPanel.focus();
}
btnPanel.addEventListener('click', () => panel.classList.contains('is-open') ? closeDrawer() : openDrawer());
drawerScrim.addEventListener('click', closeDrawer);

/* ============ controles ============ */
$('btnPlay').addEventListener('click', togglePlay);
$('btnPrev').addEventListener('click', () => load(current - 1, playing()));
$('btnNext').addEventListener('click', () => load(current + 1, playing()));
$('btnFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => toast('Pantalla completa no disponible'));
});

/* ============ teclado ============ */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) {
    if (e.key === 'Escape') togglePop(false);
    return;
  }
  if (e.key === 'Escape'){ togglePop(false); closeDrawer(); return; }
  if (e.code === 'Space'){
    if (e.target.closest('button')) return;   /* respeta la activación nativa */
    e.preventDefault(); togglePlay(); return;
  }
  if (e.ctrlKey && e.key === 'ArrowRight'){ e.preventDefault(); load(current + 1, playing()); return; }
  if (e.ctrlKey && e.key === 'ArrowLeft'){ e.preventDefault(); load(current - 1, playing()); return; }
  if (e.key === 'ArrowRight'){ audio.currentTime = clamp((audio.currentTime||0) + 5, 0, duration()); return; }
  if (e.key === 'ArrowLeft'){ audio.currentTime = clamp((audio.currentTime||0) - 5, 0, duration()); return; }
  if (e.key === 'f' || e.key === 'F'){ $('btnFull').click(); }
});

/* ============ inicio ============ */
buildTracks();
$('panelSub').textContent = SONGS.length + ' canciones · ' +
  SONGS.filter(s => s.synced).length + ' con karaoke sincronizado';
load(0, false);
requestAnimationFrame(tick);
</script>
